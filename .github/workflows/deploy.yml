name: Deploy to GitHub Pages

# In the repository settings: Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # Fails if the runner's Node 22 is older than the October 2026 security release (22.23.4).
      - run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a===22&&(b<23||(b===23&&c<4))){console.error('Node '+process.versions.node+' is older than 22.23.4');process.exit(1)}"
      - run: npm ci

      # `base: './'` makes the build work under any Pages sub-path. Tests run in the CI workflow.
      - run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
