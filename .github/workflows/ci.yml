name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # Fails if the runner's Node 22 is older than the October 2026 security release (22.23.4).
      - run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a===22&&(b<23||(b===23&&c<4))){console.error('Node '+process.versions.node+' is older than 22.23.4');process.exit(1)}"
      - run: npm ci
      # Supply chain: no known high or critical vulnerability, and every package carries a valid registry signature.
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run size

  # In a real browser: with "Protect this device" on, nothing readable is left in IndexedDB (locked or unlocked), the right
  # password and the recovery key open the app, and no content-policy or Trusted Types violation occurs. Also: no request to any
  # other origin, no serious accessibility violation on any screen, and the app opens offline.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Nothing readable on disk
        run: |
          npx vite preview --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4174/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4174/ npm run e2e:vault
          BASE_URL=http://localhost:4174/ npm run e2e:audit
          BASE_URL=http://localhost:4174/ npm run e2e:quota
